<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ student.name }}'s Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        <style>
    
            #search-bar {
                width: 250px; 
            }
        </style>
    </style>
</head>
<body class="bg-dark text-light">
    <div class="logout-btn">
        <button type="button" class="btn btn-danger" data-bs-toggle="modal" data-bs-target="#logoutModal">Logout</button>
    </div>
    <div class="text text-end ">
        <h5>Welcome, {{ student.name }}!</h5>
    </div>

    <div class="text text-center ">
        <h2>Your Subjects</h2>
    </div>

    <div class="d-flex justify-content-end mb-2">
        <form method="GET" action="{{ url_for('sdashboard') }}">
            <div class="input-group">
                <input type="text" name="query" id="search-bar" class="form-control form-control-sm" style="height: 25px; font-size: 12px; padding: 5px;" placeholder="Search for Subject" value="{{ request.args.get('query', '') }}">
                <button class="btn btn-outline-secondary btn-sm" type="submit">Search</button> 
            </div>
        </form>
    </div>

    <div class="container mt-5">
        <table class="table table-bordered border-primary">
            <thead>
                <tr>
                    <th>Subject ID</th>
                    <th>Name</th>
                    <th>Teacher</th>
                    <th>Quiz</th>
                </tr>
            </thead>
            <tbody>
                {% for s in subjects %}
                    <tr>
                        <td>{{ s.id }}</td>
                        <td>{{ s.name }}</td>
                        <td>{{ s.teacher.name }}</td>
                        <td><button><a href="{{ url_for('quiz', subject_id=s.id) }}">Take Quiz</a></button></td>
                    </tr>
                {% else %}
                    <tr>
                        <td colspan="4">No subjects available.</td>
                    </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>

    <br>
    <div class="text-center mt-4">
        <button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addSubModal">Add Subject</button>
    </div>

    <div class="modal fade" id="addSubModal" tabindex="-1" aria-labelledby="addSubModalLabel" aria-hidden="false">
        <div class="modal-dialog" style="color: black;">
            <div class="modal-content" style="color: black;">
                <div class="modal-header" style="color: black;">
                    <h5 class="modal-title" id="addSubModalLabel" style="color: black;">Add New Subject</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body" style="color: black;">
                    <form action="{{ url_for('addsub') }}" method="POST">
                        <div class="mb-3">
                            <label for="name" class="form-label" style="color: black;">Subject ID</label>
                            <input type="text" class="form-control" id="name" name="name" required>
                        </div>
                        <button type="submit" class="btn btn-primary">Add Subject</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
    <div class="modal fade" id="logoutModal" tabindex="-1" aria-labelledby="logoutModalLabel" aria-hidden="true">
        <div class="modal-dialog" style="color: black;">
            <div class="modal-content" style="color: black;">
                <div class="modal-header" style="color: black;">
                    <h5 class="modal-title" id="logoutModalLabel">Confirm Logout</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    Are you sure you want to logout?
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <a href="{{ url_for('logout') }}" class="btn btn-danger">Yes, Logout</a>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
