<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delete Question - {{ quiz.name }}</title>
</head>
<body>
    <h2>Are you sure you want to delete the question: "{{ question.description }}"?</h2>

    
    <form method="POST">
        <button type="submit">Yes, Delete</button>
        <a href="{{ url_for('questions', quiz_id=quiz.id) }}">
            <button type="button">Cancel</button>
        </a>
    </form>

    <br>
    <a href="{{ url_for('questions', quiz_id=quiz.id) }}">Back to Question List</a>
</body>
</html>
