<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Option - {{ question.description }}</title>
</head>
<body>
    <h2>Add Option for Question: {{ question.description }}</h2>
    
    <form method="POST">
        <label for="option_desc">Option Description:</label>
        <input type="text" id="option_desc" name="option_desc" required><br><br>

        <label for="flag">Flag (is this the correct answer?):</label>
        <input type="checkbox" id="flag" name="flag"><br><br>

        <button type="submit">Add Option</button>
    </form>

    <br>
    <a href="{{ url_for('questions', quiz_id=question.qid) }}">Back to Question</a>
</body>
</html>
