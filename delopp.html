<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confirm Option Deletion</title>
</head>
<body>
    <h1>Are you sure you want to delete this option?</h1>

    <h3>Quiz: {{ quiz.name }}</h3>
    <h4>Question: {{ question.text }}</h4>
    <p>Option to delete: <strong>{{ option.text }}</strong></p>


    <form method="POST" action="{{ url_for('delete_option', quiz_id=quiz.id, question_id=question.id, option_id=option.id) }}">
        <button type="submit">Yes, Delete Option</button>
    </form>

    <br>

    <a href="{{ url_for('quiz_questions', quiz_id=quiz.id) }}">Cancel</a>
</body>
</html>
